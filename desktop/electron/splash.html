<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; height: 100%; background: #07111f; color: #e2e8f0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-user-select: none; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        border: 1px solid #1e293b; box-sizing: border-box; border-radius: 14px; }
      img { width: 84px; height: 84px; }
      .t { font-size: 22px; font-weight: 700; }
      .s { font-size: 13px; color: #94a3b8; }
      .bar { width: 220px; height: 4px; background: #1e293b; border-radius: 4px; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 40%; background: #38bdf8; border-radius: 4px; animation: m 1.2s ease-in-out infinite; }
      @keyframes m { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="icon.png" alt="" />
      <div class="t">Fly Track</div>
      <div class="bar"><i></i></div>
      <div class="s" id="s">Запускаем локальный расчёт…</div>
    </div>
  </body>
</html>
