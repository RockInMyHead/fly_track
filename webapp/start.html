<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Старт трекера</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141821; --line:#252b3a; --fg:#eef2f8; --dim:#8a94a8;
    --accent:#5b8def; --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  header h1{font-size:15px;font-weight:600}
  header a{color:var(--accent);font-size:13px}
  #note{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:minmax(280px,0.8fr) 1.3fr;flex:1;min-height:0}
  .pane{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .pane:last-child{border-right:none}
  .pane h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);
    padding:8px 12px;border-bottom:1px solid var(--line)}
  #videoCol{display:flex;flex-direction:column;min-height:0;flex:1}
  #videoWrap{flex:1;min-height:100px;display:flex;align-items:center;justify-content:center;background:#000}
  #flyBlock{flex:none;border-top:1px solid var(--line);background:#0a0c10}
  #flyBlock h3{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);
    padding:6px 12px;border-bottom:1px solid var(--line)}
  #flyPlayer{height:232px;background:#000}
  #flyView{display:block;width:100%;height:100%}
  #flyLabel{font-size:11px;color:var(--dim);padding:6px 12px 8px;line-height:1.45;border-top:1px solid var(--line)}
  video{max-width:100%;max-height:100%}
  #wait{color:var(--dim);padding:24px;text-align:center}
  #planWrap{flex:1;position:relative;background:#06080c;min-height:0;cursor:crosshair;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hint{position:absolute;left:8px;bottom:8px;max-width:380px;padding:8px 10px;
    background:rgba(10,12,18,.88);border:1px solid var(--line);border-radius:8px;
    font-size:12px;color:var(--dim);pointer-events:none;line-height:1.45}
  #hint b{color:var(--fg)}
  #bar{padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{font:inherit;color:var(--fg);background:#1a1f2b;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;cursor:pointer}
  button.on{background:#163a24;border-color:var(--ok);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  #go{background:#1e3a6e;border-color:var(--accent);color:#fff;font-weight:600}
  #go:disabled{background:#1a1f2b;border-color:var(--line);font-weight:400}
  #readout{flex:1;min-width:220px;font-size:13px;color:var(--dim)}
  #legend3{font-size:12px;line-height:1.5;color:var(--dim);min-width:150px}
  #legend3 b{color:var(--fg)}
  #readout b{color:var(--fg)}
  #log{max-height:140px;overflow:auto;padding:8px 12px;font:12px/1.4 ui-monospace,monospace;
    color:var(--dim);white-space:pre-wrap;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Старт</h1>
    <span id="note"></span>
    <a href="/app">← Ролики</a>
    <a id="toFinal" href="/final">Разбор</a>
  </header>
  <main>
    <section class="pane">
      <h2>Видео</h2>
      <div id="videoCol">
        <div id="videoWrap"><div id="wait">Собираю видео для браузера…</div>
          <video id="vid" controls playsinline hidden></video></div>
        <div id="flyBlock">
          <h3>Сигнал мухи — куда поворачивает камера</h3>
          <div id="flyPlayer"><canvas id="flyView"></canvas></div>
          <div id="flyLabel">—</div>
        </div>
        <div id="modelSync" style="padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)">
          Сдвиг модели (сек): <b id="offVal">0</b>
          <input type="range" id="modelOffset" min="0" max="120" step="1" value="0" style="width:100%;margin-top:6px">
        </div>
      </div>
    </section>
    <section class="pane">
      <h2 id="planTitle">Точка и направление на графе</h2>
      <div id="planWrap">
        <canvas id="plan"></canvas>
        <div id="hint"><b>Клик по линии графа</b> ставит старт. Потом выберите, куда человек идёт.
          Колёсико — масштаб, пробел и мышь — сдвиг.</div>
      </div>
      <div id="bar">
        <button type="button" id="fit">Вся карта</button>
        <button type="button" id="dirA" hidden></button>
        <button type="button" id="dirB" hidden></button>
        <select id="verSel" title="версия трекера">
          <option value="all">Все (V1–V5)</option>
          <option value="v5">V5 — маршрут V1, стоит по мухе и шагам</option>
          <option value="v4">V4 — развилки V1 + стоит по мухе и шагам</option>
          <option value="v3">V3 — стоит по мухе и шагам</option>
          <option value="v2">V2 — стоит по пикселям</option>
          <option value="v1">V1 — первая замороженная</option>
        </select>
        <div id="legend3"></div>
        <button type="button" id="go" disabled>Старт</button>
        <div id="readout">Кликните на ребро графа.</div>
      </div>
      <div id="log" hidden></div>
    </section>
  </main>
</div>
<script src="/playback_sync.js"></script>
<script src="/fly_panel.js"></script>
<script>
const $ = id => document.getElementById(id);
let trajRows = [], playT = null, startPin = null, trackDur = 1e9, modelOffset = 0;
const VER_COLORS = {v1: '#c084fc', v2: '#38bdf8', v3: '#22c55e', v4: '#f43f5e', v5: '#facc15'};
let runs = {};
function modelTime(videoT){
  return Math.max(0, Math.min(+videoT - modelOffset, trackDur));
}
function syncPlan(videoT){
  playT = modelTime(videoT);
  flyPanel.draw(playT);
  draw();
}
const flyPanel = FlyMotionPanel.bind({
  canvasId: 'flyView', labelId: 'flyLabel', videoId: 'vid',
  getRows: () => trajRows,
  onTime(t){ syncPlan(t); },
});
const CLIP = (() => {
  if (location.pathname === '/start5' || location.pathname === '/start5.html') return 'VID00020';
  const q = new URLSearchParams(location.search).get('clip');
  return q || 'VID00001';
})();
$('toFinal').href = '/final?clip=' + CLIP + '&full=1';
let graph = null, planImg = null, segs = [];
let trackerReady = false;
let scale = 1, offX = 0, offY = 0, space = false, panning = false, lastPan = null;
let click = null, place = null, toward = null, polling = null;

function sampleTrajAt(t){
  return PlaybackSync.sampleTraj(trajRows, t);
}

function indexGraph(g){
  const nodes = {};
  const raw = Array.isArray(g.nodes) ? g.nodes : Object.values(g.nodes || {});
  for(const n of raw) if(n && n.id) nodes[n.id] = n;
  const edges = Array.isArray(g.edges) ? g.edges : Object.values(g.edges || {});
  return {nodes, edges, img_w: g.img_w || 5298, img_h: g.img_h || 3743};
}
function planSize(){
  const iw = (planImg && planImg.naturalWidth) || (graph && +graph.img_w) || 5298;
  const ih = (planImg && planImg.naturalHeight) || (graph && +graph.img_h) || 3743;
  return {iw, ih};
}
function buildSegs(){
  const {iw, ih} = planSize();
  segs = [];
  for(const e of graph.edges){
    const a = graph.nodes[e.from], b = graph.nodes[e.to];
    if(!a || !b) continue;
    segs.push({id: e.id, ax: a.x * iw, ay: a.y * ih, bx: b.x * iw, by: b.y * ih});
  }
}
function fit(){
  const wrap = $('planWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(w < 10 || h < 10) return;
  const {iw, ih} = planSize();
  scale = Math.min(w / iw, h / ih) * 0.98;
  offX = (w - iw * scale) / 2;
  offY = (h - ih * scale) / 2;
  draw();
}
function toPlan(e){
  const r = $('plan').getBoundingClientRect();
  return {x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale};
}
function draw(){
  const c = $('plan'), wrap = $('planWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if(w < 10 || h < 10 || !graph) return;
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#06080c';
  ctx.fillRect(0, 0, w, h);
  const {iw, ih} = planSize();
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  if(planImg && planImg.complete && planImg.naturalWidth){
    ctx.globalAlpha = 0.9;
    ctx.drawImage(planImg, 0, 0, iw, ih);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(180,190,210,0.85)';
  ctx.lineWidth = Math.max(1, 1.4 / scale);
  for(const s of segs){
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();
  }
  const shown = Object.keys(runs);
  shown.forEach((v, k) => {
    const pts = runs[v].route;
    // небольшой сдвиг, чтобы совпадающие линии не закрывали друг друга
    const d = (k - (shown.length - 1) / 2) * 3 / scale;
    ctx.strokeStyle = VER_COLORS[v];
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(2, 3.5 / scale);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    let prev = null;
    for(const p of pts){
      const jump = prev && Math.hypot(p[0] - prev[0], p[1] - prev[1]) > 30;
      if(!prev || jump){
        if(prev) ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p[0] + d, p[1] + d);
      } else ctx.lineTo(p[0] + d, p[1] + d);
      prev = p;
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
  if(place){
    const ends = place.ends || [];
    const dest = ends.find(n => n.id === toward);
    if(dest){
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = Math.max(2.5, 4 / scale);
      ctx.beginPath(); ctx.moveTo(place.x, place.y); ctx.lineTo(dest.x, dest.y); ctx.stroke();
    }
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(place.x, place.y, Math.max(5, 9 / scale), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = Math.max(1.5, 2 / scale);
    ctx.beginPath();
    ctx.arc(place.x, place.y, Math.max(10, 16 / scale), 0, Math.PI * 2);
    ctx.stroke();
  }
  if(startPin){
    ctx.fillStyle = '#f59e0b';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(1.8, 3 / scale);
    ctx.beginPath();
    ctx.arc(startPin.x, startPin.y, Math.max(7, 12 / scale), 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  const legend = [];
  shown.forEach((v, k) => {
    const cur = playT != null ? PlaybackSync.sampleTraj(runs[v].rows, playT) : null;
    const stopped = cur && (cur.is_stop === '1' || cur.is_stop === 1);
    legend.push(`<span style="color:${VER_COLORS[v]}">● ${v.toUpperCase()}</span> ${runs[v].meters} м`
      + (cur ? ` · <b>${stopped ? 'СТОИТ' : 'ИДЁТ'}</b>` : ''));
    if(!cur) return;
    ctx.fillStyle = VER_COLORS[v];
    ctx.strokeStyle = stopped ? '#f59e0b' : '#ffffff';
    ctx.lineWidth = Math.max(2, (stopped ? 5 : 3) / scale);
    ctx.beginPath();
    ctx.arc(+cur.x, +cur.y, Math.max(6, 10 / scale), 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#eef2f8';
    ctx.font = `${Math.max(10, 14 / scale)}px sans-serif`;
    ctx.fillText(v.toUpperCase(), +cur.x + 12 / scale, +cur.y - (10 - k * 14) / scale);
  });
  ctx.restore();
  $('legend3').innerHTML = legend.join('<br>')
    + (playT != null && shown.length ? `<br><span style="color:#8a94a8">t=${playT.toFixed(1)} с · оранжевая обводка = стоит</span>` : '');
}
function showDirs(p){
  const buttons = [$('dirA'), $('dirB')];
  (p.ends || []).forEach((n, i) => {
    const b = buttons[i];
    b.hidden = false;
    b.textContent = 'Идти к ' + n.id;
    b.dataset.id = n.id;
    b.classList.toggle('on', n.id === toward);
  });
}
function readout(){
  if(!place){ $('readout').textContent = 'Кликните на ребро графа.'; return; }
  if(!toward){
    $('readout').innerHTML = `Ребро <b>${place.edge}</b>. Выберите, куда идёт человек.`;
    return;
  }
  if(!trackerReady){
    $('readout').innerHTML = `Точка выбрана (ребро <b>${place.edge}</b>, к <b>${toward}</b>). `
      + `<b>«Старт»</b> включится, когда досчитаются brain и yaw для этого ролика (обычно 10–40 мин).`;
    return;
  }
  const behind = place.start_from;
  $('readout').innerHTML = `Ребро <b>${place.edge}</b>, идёт к <b>${toward}</b>, `
    + `<b>${place.progress_m} м</b> от ${behind}.`;
}
async function commit(x, y, dir){
  const r = await fetch('/api/start/place', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({x, y, toward: dir || ''})});
  const j = await r.json();
  if(!j.ok){ $('readout').textContent = j.error || 'мимо графа'; return; }
  place = j;
  if(dir) toward = dir;
  showDirs(j);
  $('go').disabled = !toward || !trackerReady;
  readout();
  draw();
}
async function poll(){
  const r = await fetch('/api/start/status');
  const j = await r.json();
  $('log').hidden = false;
  $('log').textContent = j.log || j.error || j.state;
  if(j.state === 'running') return;
  clearInterval(polling);
  polling = null;
  $('go').disabled = false;
  if(j.state === 'done'){
    await loadRoute();
    const v = VER() === 'all' ? 'v5' : VER();
    $('readout').innerHTML = 'Готово, линии на плане. Запусти видео — точки поедут. <a href="/final?clip=' + CLIP + '&ver=' + v + '&full=1" style="color:#5b8def">Разбор по одной версии</a>';
  } else {
    $('readout').textContent = j.error || 'трекер остановился';
  }
}
async function loadRoute(){
  const want = VER() === 'all' ? ['v1', 'v2', 'v3', 'v4', 'v5'] : [VER()];
  const next = {};
  for(const v of want){
    try{
      const r = await fetch('/api/final/state?clip=' + encodeURIComponent(CLIP) + '&ver=' + v);
      const j = await r.json();
      if(!j.ok || j.version !== v || !j.trajectory || !j.trajectory.length) continue;
      next[v] = {
        rows: j.trajectory,
        route: j.trajectory.map(p => [+p.x, +p.y]),
        meters: j.report && j.report.stats ? j.report.stats.route_meters : '?',
      };
      trackDur = j.tracker_duration != null ? +j.tracker_duration : +j.duration || 1e9;
      startPin = j.start_xy || {x:+j.trajectory[0].x, y:+j.trajectory[0].y};
    }catch(_e){ /* нет прогона этой версии */ }
  }
  runs = next;
  const main = runs.v5 || runs.v4 || runs.v3 || runs.v2 || runs.v1;
  trajRows = main ? main.rows : [];
  if(main){
    modelOffset = +localStorage.getItem('model_offset_' + CLIP) || 0;
    $('modelOffset').value = modelOffset;
    $('offVal').textContent = modelOffset;
    $('planTitle').textContent = 'Граф: оранж = старт, цветные точки = версии трекера';
  }
  draw();
}
$('modelOffset').addEventListener('input', e => {
  modelOffset = +e.target.value;
  $('offVal').textContent = modelOffset;
  localStorage.setItem('model_offset_' + CLIP, String(modelOffset));
  syncPlan($('vid').currentTime || 0);
});
const VER = () => $('verSel').value;
$('verSel').value = localStorage.getItem('start_ver') || 'all';
if(!$('verSel').value) $('verSel').value = 'all';
$('verSel').addEventListener('change', () => {
  localStorage.setItem('start_ver', VER());
  loadRoute();
});
$('fit').onclick = fit;
$('dirA').onclick = () => { if(click){ toward = $('dirA').dataset.id; commit(click.x, click.y, toward); } };
$('dirB').onclick = () => { if(click){ toward = $('dirB').dataset.id; commit(click.x, click.y, toward); } };
$('go').onclick = async () => {
  if(!click || !toward) return;
  $('go').disabled = true;
  runs = {};
  draw();
  $('readout').textContent = VER() === 'all' ? 'Запускаю V1–V5 по очереди…' : 'Запускаю трекер…';
  const r = await fetch('/api/start/run', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({x: click.x, y: click.y, toward, clip: CLIP, ver: VER()})});
  const j = await r.json();
  if(!j.ok){ $('go').disabled = false; $('readout').textContent = j.error || 'не запустилось'; return; }
  if(polling) clearInterval(polling);
  polling = setInterval(poll, 1000);
  poll();
};
const canvas = $('plan');
canvas.addEventListener('mousedown', e => {
  if(e.button === 1 || (space && e.button === 0)){ panning = true; lastPan = [e.clientX, e.clientY]; return; }
  if(e.button !== 0 || !graph) return;
  const p = toPlan(e);
  click = p;
  toward = null;
  $('go').disabled = true;
  commit(p.x, p.y, null);
});
window.addEventListener('mousemove', e => {
  if(!panning || !lastPan) return;
  offX += e.clientX - lastPan[0];
  offY += e.clientY - lastPan[1];
  lastPan = [e.clientX, e.clientY];
  draw();
});
window.addEventListener('mouseup', () => { panning = false; lastPan = null; });
window.addEventListener('keydown', e => { if(e.code === 'Space'){ space = true; e.preventDefault(); } });
window.addEventListener('keyup', e => { if(e.code === 'Space') space = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const next = scale * (e.deltaY < 0 ? 1.12 : 1/1.12);
  const k = next / scale;
  offX = px - (px - offX) * k;
  offY = py - (py - offY) * k;
  scale = next;
  draw();
}, {passive:false});
window.addEventListener('resize', fit);

async function loadVideo(){
  const r = await fetch('/api/start/state?clip=' + encodeURIComponent(CLIP));
  const j = await r.json();
  if(j.title) $('title').textContent = j.title;
  $('note').textContent = j.note || '';
  trackerReady = !!j.tracker_ready;
  if(place && toward) $('go').disabled = !trackerReady;
  if(!j.video_url){
    setTimeout(loadVideo, 2500);
    return;
  }
  $('wait').hidden = true;
  const v = $('vid');
  v.hidden = false;
  const want = j.video_url;
  if(v.getAttribute('src') !== want){
    v.src = want;
    v.load();
  }
  flyPanel.load(CLIP).catch(() => {});
  if(!v._syncBound){
    v._syncBound = true;
    v.addEventListener('seeked', () => syncPlan(v.currentTime));
  }
  if(!trackerReady) setTimeout(loadVideo, 2500);
}
async function boot(){
  const [gs] = await Promise.all([
    fetch('/api/p08/state').then(r => r.json()),
    loadVideo(),
  ]);
  graph = indexGraph(gs.graph || {});
  planImg = new Image();
  planImg.src = '/api/p08/plan';
  await new Promise((res, rej) => { planImg.onload = res; planImg.onerror = rej; });
  buildSegs();
  fit();
  await loadRoute();
}
boot();
</script>
</body>
</html>
